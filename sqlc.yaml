version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/000001_init.sql"
    queries: "internal/store/query"
    gen:
      go:
        package: "db"
        out: "internal/store/db"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_empty_slices: true
